<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="vinylBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181824"/>
      <stop offset="40%" stop-color="#0a0a10"/>
      <stop offset="85%" stop-color="#14141e"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a2be2"/>
      <stop offset="100%" stop-color="#00ffff"/>
    </linearGradient>
  </defs>
  
  <rect width="300" height="300" fill="#0d0e15"/>
  
  <!-- Outer Vinyl Disc -->
  <circle cx="150" cy="150" r="130" fill="url(#vinylBg)" stroke="#2a2b3d" stroke-width="2"/>
  
  <!-- Grooves -->
  <circle cx="150" cy="150" r="115" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  <circle cx="150" cy="150" r="100" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5"/>
  <circle cx="150" cy="150" r="85" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  <circle cx="150" cy="150" r="70" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
  
  <!-- Center Label -->
  <circle cx="150" cy="150" r="50" fill="url(#labelGrad)"/>
  
  <!-- DJ Icon in center -->
  <path d="M135 140 A 15 15 0 0 1 165 140 V 158 A 4 4 0 0 1 161 162 H 158 V 146 A 8 8 0 0 0 142 146 V 162 H 139 A 4 4 0 0 1 135 158 Z" fill="#ffffff"/>
  <circle cx="150" cy="150" r="8" fill="#0d0e15"/>
  <circle cx="150" cy="150" r="3" fill="#ffffff"/>
  
  <text x="150" y="275" font-family="'Orbitron', sans-serif" font-size="14" font-weight="bold" fill="#00ffff" text-anchor="middle" letter-spacing="3">JMF RADIO 24/7</text>
</svg>
