<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JMF Radio | 24/7 Live Stream</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <!-- 3D Canvas Container -->
  <div id="canvas-container"></div>

  <!-- UI Overlay -->
  <div id="ui-overlay">
    <!-- Top Header Bar -->
    <header class="top-bar">
      <div class="station-brand">
        <div class="on-air-badge">
          <span class="live-dot"></span>
          <span>ON AIR</span>
        </div>
        <h1 class="station-title">JMF <span>RADIO</span></h1>
      </div>

      <div class="header-right">
        <!-- Live Audio Waveform Icon -->
        <div class="audio-wave-indicator" id="wave-indicator">
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
        </div>
        
        <button class="icon-btn" id="btn-queue-toggle" title="Upcoming Queue">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
        </button>
      </div>
    </header>

    <!-- Camera Switcher Pills (Top Center) -->
    <div class="camera-toolbar">
      <button class="cam-btn active" data-cam="booth">
        <span>🎧 DJ Focus</span>
      </button>
      <button class="cam-btn" data-cam="dance">
        <span>🕺 Dance Floor</span>
      </button>
      <button class="cam-btn" data-cam="bar">
        <span>🍸 Bar Lounge</span>
      </button>
      <button class="cam-btn" data-cam="lounge">
        <span>👑 VIP Lounge</span>
      </button>
      <button class="cam-btn" data-cam="decks">
        <span>🎛️ Decks</span>
      </button>
      <button class="cam-btn" data-cam="room">
        <span>🛋️ Full Club</span>
      </button>
      <button class="cam-btn" data-cam="cinematic">
        <span>🛸 Cinema Cam</span>
      </button>
    </div>

    <!-- Theme / Lighting Switcher (Right Side) -->
    <div class="lighting-toolbar">
      <button class="theme-btn active" data-theme="cyber" title="Cyberpunk Neon">🟣</button>
      <button class="theme-btn" data-theme="sunset" title="Sunset Lo-Fi">🌅</button>
      <button class="theme-btn" data-theme="matrix" title="Emerald Matrix">🟢</button>
      <button class="theme-btn" data-theme="acid" title="Electric Blue">⚡</button>
    </div>

    <!-- Upcoming Queue Drawer -->
    <div class="queue-drawer hidden" id="queue-drawer">
      <div class="queue-header">
        <h3>UPCOMING QUEUE</h3>
        <button id="queue-close-btn">&times;</button>
      </div>
      <div class="queue-list" id="queue-list">
        <!-- Injected via JS -->
      </div>
    </div>

    <!-- Bottom Player Control Bar -->
    <footer class="player-bar">
      <!-- Left: Track Info & Album Art -->
      <div class="now-playing-section">
        <div class="album-art-wrap">
          <img id="track-cover" src="/cover-placeholder.svg" alt="Album Cover" class="cover-img">
          <div class="cover-vinyl-ring"></div>
        </div>
        <div class="track-meta">
          <div class="track-title-wrap">
            <h2 class="track-title" id="track-title">Connecting to radio stream...</h2>
          </div>
          <p class="track-artist" id="track-artist">JMF Radio 24/7</p>
        </div>
      </div>

      <!-- Center: Main Playback Controls -->
      <div class="playback-controls">
        <div class="control-buttons">
          <button class="ctrl-btn icon-small" id="btn-prev" title="Previous Track">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"></line></svg>
          </button>

          <button class="ctrl-btn play-main" id="btn-play-pause" title="Play / Pause">
            <svg id="icon-play" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            <svg id="icon-pause" class="hidden" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
          </button>

          <button class="ctrl-btn icon-small" id="btn-next" title="Next Track">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"></line></svg>
          </button>
        </div>

        <div class="progress-container">
          <span class="time-label" id="time-current">0:00</span>
          <div class="progress-bar-bg" id="progress-bar">
            <div class="progress-bar-fill" id="progress-fill"></div>
          </div>
          <span class="time-label" id="time-total">0:00</span>
        </div>
      </div>

      <!-- Right: Volume & Audio FX -->
      <div class="extra-controls">
        <div class="volume-slider-wrap">
          <button class="icon-btn-ghost" id="btn-mute" title="Mute / Unmute">
            <svg id="icon-vol" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
            <svg id="icon-mute" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
          </button>
          <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" class="custom-slider" title="Volume">
        </div>

        <button class="icon-btn-ghost" id="btn-fullscreen" title="Toggle Fullscreen">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
        </button>
      </div>
    </footer>
  </div>

  <!-- Start Audio Overlay (for browser Autoplay Policy) -->
  <div id="start-overlay" class="start-overlay">
    <div class="start-card">
      <div class="start-vinyl-icon">🎧</div>
      <h2>JMF RADIO</h2>
      <p>Click "ENTER CLUB" to activate live audio stream and start the DJ session</p>
      <button id="btn-start-stream" class="btn-primary-glow">
        <span>ENTER CLUB</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
      </button>
    </div>
  </div>

  <!-- Main JavaScript App -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
